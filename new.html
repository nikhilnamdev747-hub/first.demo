<!DOCTYPE html>
<html>
<head>
<style>
body {
    background: linear-gradient(45deg, #4facfe, #00f2fe);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass Box */
.glass {
    background: rgba(255, 255, 255, 0.2); /* transparent */
    border-radius: 15px;
    padding: 30px;
    width: 300px;

    backdrop-filter: blur(10px); /* blur effect */
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    text-align: center;
}
</style>
</head>

<body>

<div class="glass">
    <h2>Glass Effect 😎</h2>
    <p>This looks like frosted glass!</p>
</div>

</body>
</html>
